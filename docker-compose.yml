# AI API Prices — local container setup.
#
#   docker compose up -d --build                        start the site
#   docker compose --profile refresh run --rm refresh   re-read providers

name: oxweb-prices

services:
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_OXWEB_URL: ${NEXT_PUBLIC_OXWEB_URL:-https://oxweb.xyz}
    image: oxweb-prices-app:latest
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    # Override the default host binding with APP_BIND_HOST / APP_PORT.
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-3100}:3000"
    # Keep the generated dataset available to both container targets.
    volumes:
      - ./data:/app/data

  # One-shot: reruns every provider adapter and rewrites data/prices.json.
  # The app picks the new file up within its 5-minute revalidation window.
  refresh:
    profiles: ["refresh"]
    build:
      context: .
      target: refresh
    image: oxweb-prices-refresh:latest
    restart: "no"
    volumes:
      - ./data:/app/data
